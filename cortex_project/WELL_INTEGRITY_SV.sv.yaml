verified_queries:
  - name: 0;1
    question: How many wells are in each risk tier?
    sql: SELECT RISK_TIER, COUNT(*) AS well_count FROM wells_gold GROUP BY RISK_TIER
    verified_at: 1787883299
    verified_by: Semantic Model Generator
  - name: 1;1
    question: Which operators have the most high risk wells?
    sql: SELECT OPERATOR_NAME, COUNT(*) AS high_risk_count FROM wells_gold WHERE RISK_TIER
      = 'High' GROUP BY OPERATOR_NAME ORDER BY high_risk_count DESC LIMIT 10
    verified_at: 1787883299
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What is the average age of the oldest casing by risk tier?
    sql: SELECT RISK_TIER, AVG(OLDEST_CASING_AGE_YEARS) AS avg_casing_age FROM wells_gold
      GROUP BY RISK_TIER ORDER BY avg_casing_age DESC
    verified_at: 1787883299
    verified_by: Semantic Model Generator
  - name: 3;1
    question: How many wells have ever had a serious SCVF?
    sql: SELECT COUNT(*) AS serious_scvf_count FROM wells_gold WHERE EVER_SERIOUS_SCVF
      = 1
    verified_at: 1787883299
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What is the average risk score by well mode?
    sql: SELECT WELL_MODE, COUNT(*) AS well_count, AVG(RISK_SCORE) AS avg_risk_score
      FROM wells_gold GROUP BY WELL_MODE ORDER BY avg_risk_score DESC
    verified_at: 1787883299
    verified_by: Semantic Model Generator
  - name: 5;1
    question: Which operators have the most wells with H2S present?
    sql: SELECT OPERATOR_NAME, COUNT(*) AS well_count FROM wells_gold WHERE EVER_H2S_PRESENT
      = 1 GROUP BY OPERATOR_NAME ORDER BY well_count DESC LIMIT 10
    verified_at: 1787883299
    verified_by: Semantic Model Generator